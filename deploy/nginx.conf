# Variante nginx, si vous préférez nginx + certbot à Caddy.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/familyboard
#   sudo ln -s /etc/nginx/sites-available/familyboard /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d agenda.mondomaine.fr   # installe le certificat et la redirection HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name agenda.mondomaine.fr;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Indispensable : l'application marque le cookie de session « Secure »
        # et construit ses URL de retour OAuth à partir de ce protocole.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 1m;
}
